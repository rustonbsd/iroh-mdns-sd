[package]
name = "iroh-mdns-sd"
version = "0.1.0-pre1"
edition = "2024"
description = "mdns-sd crate wrapped for iroh address lookup"
license = "MIT"
authors = ["Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/iroh-mdns-sd"
readme = "README.md"
keywords = ["networking","iroh", "mdns", "address-lookup"]
categories = ["network-programming"]

[dependencies]
iroh = { version = "1", default-features = false }
iroh-base = { version = "1", default-features = false, features = ["key"] }
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
data-encoding = "2"

n0-watcher = "1"
n0-future = "0.3"
futures-util = "0.3"

mdns-sd = { version = "0.21" }

[dev-dependencies]
iroh = { version = "1.0.0" }
n0-tracing-test = "0.3"
n0-error = "1.0.1"
rand = "0.10"
rand_chacha = "0.10"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
